[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "splendor_duel"
version = "0.1.0"
description = "Splendor Duel engine, ported to Rust"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "splendor_duel_engine._core"