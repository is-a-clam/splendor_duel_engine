[package]
name = "engine_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mt19937 = "3.3"
rand_core = "0.10"

[profile.release]
lto = true
codegen-units = 1