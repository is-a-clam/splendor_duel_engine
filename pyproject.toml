[project]
name = "splendor-duel-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Isaac Lam", email = "isaaccylam@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "maturin>=1.15.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.1"]

[tool.ruff]
# docs/ is prose and planning artifacts (including the plan's fenced Python
# snippets); the formatter must not rewrite it.
extend-exclude = ["docs"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
